<svg xmlns="http://www.w3.org/2000/svg" width="240" height="190" viewBox="0 0 240 190" fill="none">
  <defs>
    <radialGradient id="warmth"><stop stop-color="#eebf78" stop-opacity=".4"/><stop offset="1" stop-color="#eebf78" stop-opacity="0"/></radialGradient>
    <linearGradient id="fire" x1="120" y1="48" x2="120" y2="116" gradientUnits="userSpaceOnUse"><stop stop-color="#e3a54d"/><stop offset=".55" stop-color="#efba68"/><stop offset="1" stop-color="#c47b38"/></linearGradient>
    <linearGradient id="clay" x1="120" y1="122" x2="120" y2="160" gradientUnits="userSpaceOnUse"><stop stop-color="#b2784d"/><stop offset="1" stop-color="#70422c"/></linearGradient>
    <linearGradient id="rim" x1="56" y1="126" x2="184" y2="126" gradientUnits="userSpaceOnUse"><stop stop-color="#a8784c"/><stop offset=".5" stop-color="#dfbd84"/><stop offset="1" stop-color="#ad7949"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <style>
    .diya-glow{animation:diya-breathe 3.6s ease-in-out infinite}
    .diya-flame{transform-box:fill-box;transform-origin:50% 100%;animation:diya-flicker 2.6s ease-in-out infinite}
    .diya-ember{animation:diya-rise 4.8s ease-in-out infinite}
    .diya-ember-b{animation-delay:-2.4s}
    .diya-line{stroke-dasharray:26 116;animation:diya-light 3.6s ease-in-out infinite}
    @keyframes diya-breathe{0%,100%{opacity:.6}50%{opacity:1}}
    @keyframes diya-flicker{0%,100%{transform:scale(.97,1)}35%{transform:scale(1.04,.96)}70%{transform:scale(.96,1.04)}}
    @keyframes diya-rise{0%{opacity:0;transform:translateY(5px)}30%{opacity:.55}100%{opacity:0;transform:translateY(-17px)}}
    @keyframes diya-light{0%{stroke-dashoffset:32;opacity:0}30%,70%{opacity:.65}100%{stroke-dashoffset:-142;opacity:0}}
    @media(prefers-reduced-motion:reduce){.diya-glow,.diya-flame,.diya-ember,.diya-line{animation:none}.diya-ember,.diya-line{opacity:.35}}
  </style>
  <ellipse cx="120" cy="91" rx="81" ry="77" fill="url(#warmth)" class="diya-glow"/>
  <circle cx="88" cy="67" r="1.6" fill="#bf945b" class="diya-ember"/>
  <circle cx="149" cy="55" r="1.4" fill="#bf945b" class="diya-ember diya-ember-b"/>
  <path d="M72 95h7m-3.5-3.5v7M161 81h6m-3-3v6" stroke="#c6a477" stroke-linecap="round" opacity=".4"/>
  <ellipse cx="120" cy="167" rx="55" ry="4" fill="#6a472f" opacity=".1" filter="url(#blur)"/>
  <path d="M59 126c12 23 30 34 61 34s49-11 61-34" fill="url(#clay)"/>
  <path d="M73 139c13 10 28 14 47 14s34-4 47-14" stroke="#d2a16b" stroke-opacity=".55" stroke-linecap="round"/>
  <ellipse cx="120" cy="126" rx="64" ry="12" fill="url(#rim)"/>
  <ellipse cx="120" cy="124" rx="54" ry="6" fill="#704b31"/>
  <path d="M120 125c0-6-1-11-4-15" stroke="#4d3827" stroke-width="3" stroke-linecap="round"/>
  <g class="diya-flame">
    <path d="M119 114c-14-5-20-17-13-31 6-12 16-18 17-36 11 17 7 28 12 41 5 14-2 24-16 26Z" fill="url(#fire)"/>
    <path d="M120 112c-8-4-10-11-6-18 3-5 7-9 8-18 6 10 2 15 5 21 3 7 0 12-7 15Z" fill="#fff0c3"/>
  </g>
  <path d="M48 181h144" stroke="#dac7a9" stroke-linecap="round"/>
  <path d="M48 181h144" stroke="#a67943" stroke-width="1.5" stroke-linecap="round" class="diya-line"/>
</svg>
